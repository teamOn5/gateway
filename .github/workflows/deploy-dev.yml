name: Deploy Gateway (develop) to Self-Hosted Runner

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3-A. Gradle 빌드 (Windows Runner)
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat clean bootJar -x test

      - name: 3-B. Gradle 빌드 (Linux / macOS Runner)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: 4-A. Docker 배포 (Windows Runner)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          docker compose -f docker-compose.dev.yml down --remove-orphans 2>nul || exit /b 0
          docker compose -f docker-compose.dev.yml up -d --build
          docker compose -f docker-compose.dev.yml ps

      - name: 4-B. Docker 배포 (Linux / macOS Runner)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          docker compose -f docker-compose.dev.yml down --remove-orphans || true
          docker compose -f docker-compose.dev.yml up -d --build
          docker compose -f docker-compose.dev.yml ps

      - name: 5-A. 배포 완료 알림 (Windows Runner)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo ==================================================
          echo Gateway Service (dev) deployed successfully in Docker!
          echo Swagger UI:   http://localhost:8080/swagger-ui.html
          echo Health check: http://localhost:8080/actuator/health
          echo ==================================================

      - name: 5-B. 배포 완료 알림 (Linux / macOS Runner)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "=================================================="
          echo "Gateway Service (dev) deployed successfully in Docker!"
          echo "Swagger UI:   http://localhost:8080/swagger-ui.html"
          echo "Health check: http://localhost:8080/actuator/health"
          echo "=================================================="

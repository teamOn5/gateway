server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 1. User Service
        - id: user-service-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        # 2. Live & Streaming Service
        - id: live-service-route
          uri: lb://LIVE-SERVICE
          predicates:
            - Path=/api/lives/**

        # 3. Chat Service
        - id: chat-service-route
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/api/chats/**

        # 4. Notification Service
        - id: notification-service-route
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://172.31.29.243:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: "User Service"
        url: /api/users/v3/api-docs
      - name: "Notification Service"
        url: /api/notifications/v3/api-docs

server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # User Service (Auth + Member + Seller + Manager)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1

        # Member Service
        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/member-service/**
          filters:
            - StripPrefix=1

        # Product Service
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product-service/**
          filters:
            - StripPrefix=1

        # Order Service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order-service/**
          filters:
            - StripPrefix=1

        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/**
          filters:
            - StripPrefix=1

        # Live Service
        - id: live-service
          uri: lb://live-service
          predicates:
            - Path=/live-service/**
          filters:
            - StripPrefix=1

        # Chat Service
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/chat-service/**
          filters:
            - StripPrefix=1

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1

        # Shop Service
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/shop-service/**
          filters:
            - StripPrefix=1
            

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 🔔 Notification Service
        url: /notification-service/api/notifications/v3/api-docs
      # 현재 노트북 로컬 환경에 미구동된 서비스는 필요 시 주석 해제하여 사용
      # - name: 👤 Member Service
      #   url: /member-service/v3/api-docs
      # - name: 📦 Product Service
      #   url: /product-service/v3/api-docs
      # - name: 🛒 Order Service
      #   url: /order-service/v3/api-docs
      # - name: 💳 Payment Service
      #   url: /payment-service/v3/api-docs
      # - name: 📺 Live Service
      #   url: /live-service/v3/api-docs
      # - name: 💬 Chat Service
      #   url: /chat-service/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

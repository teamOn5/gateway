server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 1. User & Test Service
        - id: user-service-route
          uri: lb://TEST-SERVICE
          predicates:
            - Path=/api/users/**

        # 2. Live & Streaming Service
        - id: live-service-route
          uri: lb://LIVE-SERVICE
          predicates:
            - Path=/api/lives/**

        # 3. Chat Service
        - id: chat-service-route
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/api/chats/**

        # 4. Notification Service
        - id: notification-service-route
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 🔔 Notification Service
        url: /api/notifications/v3/api-docs
      - name: 👤 User Service
        url: /api/users/v3/api-docs
      - name: 📺 Live Service
        url: /api/lives/v3/api-docs
      - name: 💬 Chat Service
        url: /api/chats/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
